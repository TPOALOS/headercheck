[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "headercheck"
version = "1.1.0"
description = "Grade the HTTP security headers of a site you operate, with fixes. CSP depth checks, JSON output, URL lists."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["http-headers", "web-security", "csp", "hsts"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/headercheck"

[project.scripts]
headercheck = "headercheck:main"

[tool.setuptools]
py-modules = ["headercheck"]
